// =====================================================================
// KineticOs — Build raíz
// Configuración común para todos los subproyectos. Cada módulo declara
// su propio build.gradle con sus dependencias (fronteras de dominio).
// =====================================================================
plugins {
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.spring.dependency.management) apply false
}

allprojects {
    group = 'com.kineticos'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            // Gradle descarga el JDK 21 automáticamente (foojay) si no está instalado
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    // Lombok/MapStruct: la dependencia de anotaciones hereda de compileOnly
    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        // Spring Boot necesita los nombres de parámetros en runtime (@PathVariable, etc.)
        options.compilerArgs << '-parameters'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}
