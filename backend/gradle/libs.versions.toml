# =====================================================================
# MiCoach — Version Catalog centralizado
# Alias -> librerías/plugins. Los módulos usan: libs.xxx.yyy
# Las versiones gestionadas por el BOM de Spring Boot NO se listan aquí.
# Subir versiones de Spring Boot actualizando `spring-boot` y re-validando.
# =====================================================================

[versions]
java = "21"
spring-boot = "3.3.5"
spring-dependency-management = "1.1.6"
lombok = "1.18.34"
mapstruct = "1.6.2"
jjwt = "0.12.6"
flyway = "10.10.0"
springdoc = "2.6.0"


[libraries]
# --- Spring Boot (versiones vía BOM) ---
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-oauth2-client = { module = "org.springframework.boot:spring-boot-starter-oauth2-client" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-resource-server" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }

# --- Drivers / BD ---
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
flyway-commandline = { module = "org.flywaydb:flyway-commandline", version.ref = "flyway" }

# --- Utilidades ---
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jjwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jjwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jjwt" }

# --- MinIO / S3 ---
minio = { module = "io.minio:minio", version = "8.5.12" }

# --- IA (Fase 4) ---
langchain4j = { module = "dev.langchain4j:langchain4j", version = "0.35.0" }
langchain4j-ollama = { module = "dev.langchain4j:langchain4j-ollama", version = "0.35.0" }
# API compatible con OpenAI: sirve para Groq y OpenRouter (solo cambia la baseUrl).
langchain4j-open-ai = { module = "dev.langchain4j:langchain4j-open-ai", version = "0.35.0" }
langchain4j-google-ai-gemini = { module = "dev.langchain4j:langchain4j-google-ai-gemini", version = "0.35.0" }
springdoc-openapi = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }


# --- Testing ---
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-rabbitmq = { module = "org.testcontainers:rabbitmq" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
