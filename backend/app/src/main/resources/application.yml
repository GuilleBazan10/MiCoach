# =====================================================================
# KineticOs — Configuración de la aplicación Spring Boot
# Todos los valores vienen de variables de entorno (.env) con defaults
# para desarrollo local. NUNCA pongas secretos en este archivo.
# =====================================================================
spring:
  application:
    name: kineticos

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:kineticos}?sslmode=${POSTGRES_SSLMODE:prefer}
    username: ${POSTGRES_USER:kineticos}
    password: ${POSTGRES_PASSWORD:change_me_strong_password}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway crea el schema; Hibernate solo valida

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-binding-errors: never

# ================== Observabilidad ==================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    # Redis y RabbitMQ están declarados (starters) para features futuras pero
    # todavía no los usa ningún flujo real. Sin esto, /actuator/health devuelve
    # 503 apenas no estén disponibles (p. ej. en Render, que no los provisiona),
    # tumbando el health check de la plataforma por un servicio que nadie usa.
    redis:
      enabled: false
    rabbit:
      enabled: false

# ================== Configuración de la app ==================
kineticos:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      expiration-ms: ${JWT_EXPIRATION_MS:900000}
      refresh-expiration-ms: ${REFRESH_TOKEN_EXPIRATION_MS:604800000}
    totp:
      issuer: ${TOTP_ISSUER:KineticOs}
    encryption-key: ${AES_SECRET:}
  # El proveedor de IA activo y sus credenciales ya no viven acá: se leen de la tabla
  # ai_provider_configs (sembrada en V11, editable desde /admin sin reiniciar el backend).
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5050}
