# KineticOs — Nginx (reverse proxy)
# Uso DEV: sirve como gateway HTTP hacia el backend de Spring Boot.
# En producción (Fase 6) además servirá el build web de Flutter.
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Backend Spring Boot corriendo en el host (Docker Desktop usa host.docker.internal)
    upstream kineticos_backend {
        server host.docker.internal:8080;
    }

    server {
        listen 80;
        server_name localhost;

        location /api/ {
            proxy_pass http://kineticos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Correlation-Id $request_id;
        }

        location /actuator/health {
            proxy_pass http://kineticos_backend;
        }
    }
}
