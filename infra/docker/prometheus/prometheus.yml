# MiCoach — Prometheus (scrape de métricas del backend)
# Se usa con docker-compose.full.yml. El backend expone métricas en
# /actuator/prometheus (Spring Boot Actuator).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "micoach"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          app: "micoach"
