# =====================================================================
# KineticOs — Blueprint de Render (backend)
# Al conectar el repo, Render lee este archivo y crea el servicio con
# esta configuración. Los valores marcados "sync: false" se cargan a
# mano una sola vez desde el dashboard (son secretos: no van al repo).
# =====================================================================
services:
  - type: web
    name: kineticos-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: POSTGRES_HOST
        sync: false
      - key: POSTGRES_PORT
        value: "5432"
      - key: POSTGRES_DB
        sync: false
      - key: POSTGRES_USER
        sync: false
      - key: POSTGRES_PASSWORD
        sync: false
      - key: POSTGRES_SSLMODE
        value: require
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "900000"
      - key: REFRESH_TOKEN_EXPIRATION_MS
        value: "604800000"
      - key: AES_SECRET
        generateValue: true
      - key: TOTP_ISSUER
        value: KineticOs
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: AI_PROVIDER
        value: groq
