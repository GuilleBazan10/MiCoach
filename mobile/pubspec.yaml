# KineticOs — App Flutter
# Paquete raíz: com.kineticos  (org del comando flutter create)
name: kineticos_mobile
description: "KineticOs - Plataforma de salud y bienestar con IA."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado y navegación
  flutter_bloc: ^9.1.1
  flutter_riverpod: ^3.4.2
  go_router: ^17.5.0
  equatable: ^2.0.5

  # Red
  dio: ^5.7.0

  # Serialización (Freezed + JSON)
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Storage (seguro + preferencias)
  flutter_secure_storage: ^11.0.0
  shared_preferences: ^2.3.3

  # Push notifications
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0

  # UI / datos
  fl_chart: ^1.2.0
  cached_network_image: ^3.4.1
  google_fonts: ^8.2.1
  intl: ^0.20.3
  path_provider: ^2.1.5
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generadores de código
  freezed: ^3.2.5
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

  # Testing
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

# NOTA para quien continúe:
# - Las versiones son caret (^): al hacer `flutter pub get`, Dart resuelve la última
#   compatible. Si alguna versión dejó de existir, ajusta con `flutter pub upgrade`.
# - Ejecuta ANTES:  flutter create . --org com.kineticos --project-name kineticos_mobile
#   para generar las carpetas de plataforma (android/ios/web/).
